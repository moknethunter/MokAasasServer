<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Voice Server · Secure Access</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#050814;--panel:#0a1020;--border:#142038;--accent:#00d9ff;--accent-2:#00ff9d;--danger:#ff3366;--text:#e6ecf5;--dim:#6b7794}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:grid;place-items:center;
background-image:linear-gradient(rgba(0,217,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,217,255,.03) 1px,transparent 1px);background-size:40px 40px}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(0,217,255,.15),transparent 60%);pointer-events:none}
.wrap{position:relative;width:100%;max-width:420px;padding:24px}
.logo{text-align:center;margin-bottom:32px}
.mark{width:64px;height:64px;margin:0 auto 16px;border-radius:16px;background:linear-gradient(135deg,#00d9ff,#0066ff);display:grid;place-items:center;font-size:32px;box-shadow:0 0 60px rgba(0,217,255,.4);animation:glow 3s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 40px rgba(0,217,255,.3)}50%{box-shadow:0 0 80px rgba(0,217,255,.6)}}
h1{font-size:22px;font-weight:700;letter-spacing:-.5px}
.logo p{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim);letter-spacing:2px;text-transform:uppercase;margin-top:6px}
.card{background:rgba(10,16,32,.8);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:16px;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.badge{display:flex;align-items:center;gap:8px;padding:10px 14px;background:rgba(0,255,157,.08);border:1px solid rgba(0,255,157,.2);border-radius:10px;font-size:12px;color:var(--accent-2);font-family:'JetBrains Mono',monospace;margin-bottom:24px}
.badge::before{content:'';width:8px;height:8px;background:var(--accent-2);border-radius:50%;box-shadow:0 0 10px var(--accent-2);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.4}}
label{display:block;font-size:12px;color:var(--dim);font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
input{width:100%;padding:14px 16px;background:rgba(0,0,0,.4);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:15px;font-family:inherit;transition:.2s;margin-bottom:20px}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,217,255,.15)}
button{width:100%;padding:14px;background:linear-gradient(135deg,#00d9ff,#0066ff);border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:600;letter-spacing:.5px;cursor:pointer;transition:.2s}
button:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 10px 30px rgba(0,217,255,.3)}
button:disabled{opacity:.5;cursor:not-allowed}
.error{padding:12px 16px;background:rgba(255,51,102,.1);border:1px solid rgba(255,51,102,.3);border-radius:10px;color:var(--danger);font-size:13px;margin-bottom:20px;display:none}
.error.show{display:block}
.footer{text-align:center;margin-top:24px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim);letter-spacing:1px}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <div class="mark">🎙️</div>
    <h1>Voice Server</h1>
    <p>Secure · Admin Only</p>
  </div>
  <div class="card">
    <div class="badge">TLS · JWT · Rate-Limited</div>
    <div class="error" id="error"></div>
    <form id="form">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit" id="btn">Sign In →</button>
    </form>
  </div>
  <div class="footer">AUTHORIZED PERSONNEL ONLY · LOGGED</div>
</div>
<script>
const form = document.getElementById('form');
const btn = document.getElementById('btn');
const errorEl = document.getElementById('error');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorEl.classList.remove('show');
  btn.disabled = true;
  btn.textContent = 'Verifying...';
  try {
    const res = await fetch('/api/v1/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
      }),
    });
    const data = await res.json();
    if (!res.ok) {
      throw new Error(
        res.status === 429 ? 'تم تجاوز المحاولات. انتظر قليلاً.'
        : res.status === 401 ? 'بيانات دخول غير صحيحة'
        : data.error || 'فشل تسجيل الدخول'
      );
    }
    window.location.href = data.redirect || '/dashboard';
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Sign In →';
  }
});
</script>
</body>
</html>
