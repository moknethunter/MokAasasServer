<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><title>لوحة التحكم</title>
<style>body{background:#050814;color:#fff;font-family:sans-serif;padding:20px} .card{background:#0a1020;padding:20px;border-radius:10px;margin-bottom:20px;border:1px solid #142038} input{padding:10px;border-radius:5px;border:1px solid #142038;background:#050814;color:#fff} button{padding:10px 20px;background:#00d9ff;border:none;border-radius:5px;cursor:pointer;margin-right:10px}</style>
</head>
<body>
  <h1>مرحباً، <span id="myName"></span></h1>
  <div class="card">
    <h3>بدء محادثة أو مكالمة (بالرقم)</h3>
    <input type="text" id="targetPhone" placeholder="أدخل رقم المستخدم...">
    <button onclick="startChat()">شات</button>
    <button onclick="startCall()" style="background:#00ff9d;">مكالمة</button>
  </div>
<script>
  document.getElementById('myName').textContent = localStorage.getItem('name');
  const myPhone = localStorage.getItem('phone');
  
  function startChat() {
    const target = document.getElementById('targetPhone').value;
    if (target) window.location.href = `/chat.html?target=${target}`;
  }
  
  function startCall() {
    const target = document.getElementById('targetPhone').value;
    if (target) window.location.href = `/call.html?target=${target}`;
  }
<!-- ضعه في أي مكان مناسب داخل لوحة التحكم -->
<a href="/admin.html" style="display:inline-block; padding:10px 20px; background:#00d9ff; color:#000; border-radius:5px; text-decoration:none; font-weight:bold; margin-top:10px;">
  إدارة الأرقام 📡
</a>
  
</script>
</body>
</html>
