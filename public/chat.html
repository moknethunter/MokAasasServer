<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MokAasasServer · Chat</title>
<script src="/socket.io/socket.io.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
  body { background: #050814; color: #fff; height: 100vh; display: flex; flex-direction: column; }
  header { background: #0a1020; padding: 15px; border-bottom: 1px solid #142038; display: flex; justify-content: space-between; align-items: center;}
  h2 { color: #00d9ff; font-size: 18px; }
  #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  .msg { background: #0a1020; border: 1px solid #142038; padding: 10px 15px; border-radius: 8px; max-width: 80%; align-self: flex-start; }
  .msg.me { background: rgba(0, 217, 255, 0.1); border-color: #00d9ff; align-self: flex-end; }
  .msg .sender { font-size: 11px; color: #6b7794; margin-bottom: 4px; }
  .msg .text { font-size: 14px; }
  form { background: #0a1020; padding: 15px; display: flex; gap: 10px; border-top: 1px solid #142038; }
  input { flex: 1; padding: 12px; background: #050814; border: 1px solid #142038; border-radius: 8px; color: #fff; outline: none; }
  input:focus { border-color: #00d9ff; }
  button { padding: 12px 20px; background: #00d9ff; border: none; border-radius: 8px; color: #000; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>
  <header>
    <h2>💬 الشات العام</h2>
    <span style="color: #00ff9d; font-size: 12px;">متصل</span>
  </header>
  <div id="messages"></div>
  <form id="chat-form">
    <input type="text" id="msg-input" placeholder="اكتب رسالتك هنا..." autocomplete="off" required>
    <button type="submit">إرسال</button>
  </form>

<script>
  const username = "مستخدم_" + Math.floor(Math.random() * 1000);
  const socket = io();
  const form = document.getElementById('chat-form');
  const input = document.getElementById('msg-input');
  const messages = document.getElementById('messages');

  function appendMessage(data) {
    const div = document.createElement('div');
    div.classList.add('msg');
    if (data.sender === username) div.classList.add('me');
    div.innerHTML = `<div class="sender">${data.sender}</div><div class="text">${data.text || data.content}</div>`;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  socket.on('chat history', (history) => {
    messages.innerHTML = ''; 
    history.forEach(msg => appendMessage({ sender: msg.sender, text: msg.content }));
  });

  socket.on('chat message', (data) => {
    appendMessage({ sender: data.sender, text: data.content });
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (input.value) {
      socket.emit('chat message', { sender: username, text: input.value });
      input.value = '';
    }
  });
</script>
</body>
</html>
