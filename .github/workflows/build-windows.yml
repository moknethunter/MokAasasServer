name: Build Windows

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: Portable ZIP
    runs-on: windows-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: "file:./dev.db"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD_HASH: $2a$12$testhashplaceholder000000000000000000000000000000000000
      SESSION_SECRET: test-secret-at-least-32-characters-long-for-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Create SQLite Database
        run: npx prisma db push

      - name: Build TypeScript
        run: npm run build

      - name: Prepare portable folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path portable -Force
          if (Test-Path dist) { Copy-Item dist portable\dist -Recurse }
          if (Test-Path public) { Copy-Item public portable\public -Recurse }
          if (Test-Path prisma) { Copy-Item prisma portable\prisma -Recurse }
          if (Test-Path package.json) { Copy-Item package.json portable\package.json }
          if (Test-Path .env.example) { Copy-Item .env.example portable\.env.example }

      - name: Install production deps in portable
        shell: pwsh
        run: |
          Push-Location portable
          npm install --omit=dev
          Pop-Location

      - name: Copy Node.js runtime
        shell: pwsh
        run: |
          $nodePath = (Get-Command node).Source
          Copy-Item $nodePath portable\node.exe

      - name: Create start.bat
        shell: pwsh
        run: |
          $bat = @"
          @echo off
          title MokAsasServer
          cd /d "%~dp0"
          echo.
          echo Starting MokAsasServer...
          echo.
          node.exe dist\index.js
          echo.
          echo Server stopped. Press any key...
          pause >nul
          "@
          Set-Content -Path portable\start.bat -Value $bat -Encoding ASCII

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path portable\* -DestinationPath MokAsasServer-Windows.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MokAsasServer-Windows
          path: MokAsasServer-Windows.zip
          retention-days: 30
